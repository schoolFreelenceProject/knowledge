services:
  api:
    build:
      context: .
      args:
        INSTALL_OLLAMA_CLIENT: ${INSTALL_OLLAMA_CLIENT:-false}
    restart: unless-stopped
    volumes:
      - kb_data:/app/data
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_AUTO_CREATE: ${DATABASE_AUTO_CREATE:-false}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      INTERNAL_GENERATION_ENABLED: ${INTERNAL_GENERATION_ENABLED:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-sentence-transformers/all-MiniLM-L6-v2}
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-company_documents}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://rag:rag_password@postgres:5432/company_rag}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-change-this-secret-change-me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      RETRIEVAL_MODE: ${RETRIEVAL_MODE:-vector}
      HYBRID_FUSION_STRATEGY: ${HYBRID_FUSION_STRATEGY:-rrf}
      HYBRID_VECTOR_WEIGHT: ${HYBRID_VECTOR_WEIGHT:-0.6}
      HYBRID_BM25_WEIGHT: ${HYBRID_BM25_WEIGHT:-0.4}
      HYBRID_CANDIDATE_MULTIPLIER: ${HYBRID_CANDIDATE_MULTIPLIER:-4}
      BM25_K1: ${BM25_K1:-1.5}
      BM25_B: ${BM25_B:-0.75}
      RERANKER_ENABLED: ${RERANKER_ENABLED:-false}
      RERANKER_MODEL_NAME: ${RERANKER_MODEL_NAME:-cross-encoder/ms-marco-MiniLM-L-6-v2}
      RERANKER_CANDIDATE_SIZE: ${RERANKER_CANDIDATE_SIZE:-20}
      RERANKER_BATCH_SIZE: ${RERANKER_BATCH_SIZE:-16}
      DOCUMENT_CHUNK_SIZE: ${DOCUMENT_CHUNK_SIZE:-1000}
      DOCUMENT_CHUNK_OVERLAP: ${DOCUMENT_CHUNK_OVERLAP:-150}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-26214400}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
      SECURITY_HEADERS_ENABLED: ${SECURITY_HEADERS_ENABLED:-true}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-120}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      CODE_REPOSITORY_ALLOWED_HOSTS: ${CODE_REPOSITORY_ALLOWED_HOSTS:-*}
      AUDIT_LOG_ENABLED: ${AUDIT_LOG_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      KB_BOOTSTRAP_ADMIN_EMAIL: ${KB_BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      KB_BOOTSTRAP_ADMIN_PASSWORD: ${KB_BOOTSTRAP_ADMIN_PASSWORD:-}
      MCP_SERVICE_ACCOUNT_PASSWORD: ${MCP_SERVICE_ACCOUNT_PASSWORD:-}
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy

  mcp:
    build:
      context: .
      args:
        INSTALL_OLLAMA_CLIENT: ${INSTALL_OLLAMA_CLIENT:-false}
    restart: unless-stopped
    volumes:
      - kb_data:/app/data
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_AUTO_CREATE: ${DATABASE_AUTO_CREATE:-false}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      INTERNAL_GENERATION_ENABLED: ${INTERNAL_GENERATION_ENABLED:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-sentence-transformers/all-MiniLM-L6-v2}
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-company_documents}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://rag:rag_password@postgres:5432/company_rag}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-change-this-secret-change-me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      RETRIEVAL_MODE: ${RETRIEVAL_MODE:-vector}
      HYBRID_FUSION_STRATEGY: ${HYBRID_FUSION_STRATEGY:-rrf}
      HYBRID_VECTOR_WEIGHT: ${HYBRID_VECTOR_WEIGHT:-0.6}
      HYBRID_BM25_WEIGHT: ${HYBRID_BM25_WEIGHT:-0.4}
      HYBRID_CANDIDATE_MULTIPLIER: ${HYBRID_CANDIDATE_MULTIPLIER:-4}
      BM25_K1: ${BM25_K1:-1.5}
      BM25_B: ${BM25_B:-0.75}
      RERANKER_ENABLED: ${RERANKER_ENABLED:-false}
      RERANKER_MODEL_NAME: ${RERANKER_MODEL_NAME:-cross-encoder/ms-marco-MiniLM-L-6-v2}
      RERANKER_CANDIDATE_SIZE: ${RERANKER_CANDIDATE_SIZE:-20}
      RERANKER_BATCH_SIZE: ${RERANKER_BATCH_SIZE:-16}
      DOCUMENT_CHUNK_SIZE: ${DOCUMENT_CHUNK_SIZE:-1000}
      DOCUMENT_CHUNK_OVERLAP: ${DOCUMENT_CHUNK_OVERLAP:-150}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-26214400}
      MCP_HOST: ${MCP_HOST:-0.0.0.0}
      MCP_PORT: ${MCP_PORT:-8001}
      MCP_PATH: ${MCP_PATH:-/mcp}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-http://localhost:8001/mcp}
      MCP_SERVICE_TOKEN_SHA256: ${MCP_SERVICE_TOKEN_SHA256:-}
      MCP_SERVICE_ACCOUNT_EMAIL: ${MCP_SERVICE_ACCOUNT_EMAIL:-mcp-service@example.com}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    command: python -m app.mcp.server
    ports:
      - "${MCP_HOST_PORT:-8001}:${MCP_PORT:-8001}"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1/ >/dev/null",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "timeout 5 bash -ec 'exec 3<>/dev/tcp/localhost/6333; printf \"GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    profiles:
      - ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_storage:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-company_rag}
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_storage:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d company_rag"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kb_data:
  qdrant_storage:
  ollama_storage:
  postgres_storage:
